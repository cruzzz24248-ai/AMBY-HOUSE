<main id="c" class="pg"><div class="wrap"><p class="eye">Configurador</p><h1>Configurá tu módulo en minutos</h1><p class="lead">Elegí el modelo, definí la línea y sumá opcionales. Te enviamos la propuesta por WhatsApp, sin compromiso.</p>
<div class="cfg"><aside class="side" aria-label="Tu módulo"><div class="pv" id="pvw"></div><p class="sline" id="pvl"></p><dl id="pvd"></dl></aside>
<div class="cp"><ol class="stp" id="stp" aria-label="Pasos"></ol><div id="panel" aria-live="polite"></div></div></div>
<div class="bar"><div class="wrap"><div class="bt"><small id="iva"></small><strong id="bt">—</strong></div><button type="button" class="btn g" id="back" hidden>Volver</button><button type="button" class="btn" id="next">Continuar</button></div></div>
<dialog id="dlg"><form id="fm" novalidate><h3>Completá tus datos</h3><p class="m2">Solo nombre y WhatsApp: te contactamos en minutos.</p><p class="sel" id="sel"></p>
<label>Tu nombre *<input name="nombre" autocomplete="name" required></label><label>WhatsApp *<input name="wa" type="tel" autocomplete="tel" inputmode="tel" required></label>
<label>Uso del módulo<select name="uso"><option value="">Seleccionar…</option><option>Vivienda</option><option>Quincho</option><option>Oficina</option><option>Renta turística</option><option>Otro</option></select></label>

<label>Comentario<textarea name="com" rows="3"></textarea></label><p class="err" id="err" role="alert"></p><div class="acts"><button class="btn" type="submit">Enviar por WhatsApp</button><button class="btn g" type="button" id="cancel">Cancelar</button></div></form></dialog></div></main><div id="ft"></div>
